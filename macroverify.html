<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Dash — macro playback</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  #gl { z-index: 0; }
  #c { z-index: 1; pointer-events: none; }
  #hud { position: fixed; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; white-space: pre; pointer-events: none; line-height: 1.45; }
  #hud b { color: #fff; font-size: 15px; }

  #levels { position: fixed; top: 8px; right: 8px; bottom: 56px; z-index: 2; width: 250px; overflow-y: auto;
            background: rgba(0,0,0,.7); border-radius: 6px; margin: 0; padding: 4px; list-style: none; }
  #levels button { all: unset; box-sizing: border-box; display: flex; width: 100%; gap: 8px; align-items: baseline;
                   padding: 5px 8px; border-radius: 4px; cursor: pointer; }
  #levels button:hover { background: rgba(255,255,255,.08); }
  #levels button:focus-visible { outline: 2px solid #7af; }
  #levels .current button { background: rgba(120,170,255,.22); }
  #levels .id { min-width: 2.6em; color: #888; text-align: right; flex: none; }
  #levels .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #levels .status { flex: none; font-variant-numeric: tabular-nums; }
  #levels .finished .status { color: #6d6; }
  #levels .died .status, #levels .stopped .status { color: #f77; }
  #levels .playing .status { color: #7af; }
  #levels .none { opacity: .45; }
  #levels .kind { flex: none; font-size: 11px; color: #aa8; }

  #bar { position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         background: rgba(0,0,0,.6); padding: 6px 8px; border-radius: 6px; }
  #bar button, #bar input { font: inherit; }
  #bar label { display: inline-flex; gap: 5px; align-items: center; }
  #speed { width: 9em; }
  #speedval { min-width: 3.2em; font-variant-numeric: tabular-nums; }
  #msg { color: #aaa; }

  /* The Levels button hides the list on a wide window and shows it on a
     narrow one, where it starts hidden so the level is not covered. */
  @media (min-width: 701px) {
    body.list-toggled #levels { display: none; }
  }
  @media (max-width: 700px) {
    #levels { top: 96px; left: 8px; right: 8px; bottom: auto; width: auto; max-height: 40vh; }
    body:not(.list-toggled) #levels { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<div id="hud"></div>
<ol id="levels" aria-label="Levels"></ol>
<div id="bar">
  <button id="prev" title="Previous level">◀ Prev</button>
  <button id="pause">Pause</button>
  <button id="next" title="Next level">Next ▶</button>
  <button id="restart" title="Play this level's run again">Restart</button>
  <label>Speed <input id="speed" type="range"> <span id="speedval"></span></label>
  <label><input id="auto" type="checkbox" checked> Next level when a run ends</label>
  <label><input id="hitboxes" type="checkbox"> Hitboxes</label>
  <label><input id="sound" type="checkbox" checked> Sound</label>
  <button id="togglelist">Levels</button>
  <span id="msg"></span>
</div>
<script type="module" src="/src/debug/macroverify.ts"></script>
</body>
</html>
